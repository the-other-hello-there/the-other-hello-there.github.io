<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Henry Luo's personal website. Explore my engineering portfolio.">
  <link rel="canonical" href="https://the-other-hello-there.github.io/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Henry Luo | Portfolios">
  <meta property="og:description" content="Explore my work and engineering portfolio.">
  <meta property="og:url" content="https://the-other-hello-there.github.io/">
  <meta name="theme-color" content="#0b1017">
  <title>Henry Luo | Portfolios</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1017;
      --text: #f3f7fb;
      --muted: #a9b6c6;
      --line: #2b3b50;
      --accent: #65d4ff;
      --accent-2: #9bf2c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: "Times New Roman", Times, serif;
      line-height: 1.65;
    }
    a { color: inherit; }
    .container { width: min(calc(100% - 36px), 1180px); margin-inline: auto; }
    .site-header { border-bottom: 1px solid rgba(255,255,255,.07); }
    .header-inner { min-height: 72px; display: flex; align-items: center; }
    .brand { font-size: 1.45rem; font-weight: 700; letter-spacing: -.04em; text-decoration: none; }
    .brand span { color: var(--accent); }
    main { flex: 1; display: grid; align-items: center; padding-block: clamp(56px, 12vh, 140px); }
    .welcome {
      max-width: 860px;
      padding: clamp(28px, 6vw, 72px);
      border: 1px solid #33536a;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(101,212,255,.08), rgba(155,242,200,.04));
    }
    .eyebrow { margin: 0 0 16px; color: var(--accent-2); font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: clamp(2.75rem, 7vw, 4.5rem); line-height: 1.1; letter-spacing: -.035em; }
    .intro { margin: 0; color: var(--muted); font-size: 1.125rem; }
    .portfolio-links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 32px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 52px;
      padding: 12px 22px;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: var(--accent);
      color: #071118;
      text-decoration: none;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(101,212,255,.17); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .skip-link { position: fixed; left: 12px; top: -80px; padding: 10px 14px; background: var(--text); color: var(--bg); border-radius: 8px; z-index: 10; }
    .skip-link:focus { top: 12px; }
    .site-footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
    .site-footer p { margin: 0; padding-block: 22px; }
    @media (max-width: 420px) {
      .container { width: calc(100% - 24px); }
      .welcome { padding: 28px 22px; }
      .btn { width: 100%; padding-inline: 14px; gap: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Henry Luo home">HL<span>.</span></a>
    </div>
  </header>
  <main id="main" class="container">
    <section class="welcome" aria-labelledby="welcome-title">
      <p class="eyebrow">Welcome</p>
      <h1 id="welcome-title">Henry Luo</h1>
      <p class="intro">Explore my work.</p>
      <nav class="portfolio-links" aria-label="Portfolios">
        <a class="btn" href="/HenryLuo-Portfolio/">Engineering Portfolio <span aria-hidden="true">&rarr;</span></a>
      </nav>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container"><p>Henry Luo</p></div>
  </footer>
</body>
</html>
